name: Build all

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin # timezone
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@03f09fa81a60371c01caf1a9deada89ceebbd5e5 # v1.6.3
      - if: ${{ hashFiles('./package.json')!=null }}
        id: node
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@03f09fa81a60371c01caf1a9deada89ceebbd5e5 # v1.6.3
        with:
          app-path: ""
      - if: ${{ hashFiles('./pom.xml')!=null }}
        id: maven
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@03f09fa81a60371c01caf1a9deada89ceebbd5e5 # v1.6.3
        with:
          app-path: ""
