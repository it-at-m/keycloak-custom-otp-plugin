name: Build all

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin # timezone
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
      - if: ${{ hashFiles('./package.json')!=null }}
        id: node
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
        with:
          app-path: ""
      - if: ${{ hashFiles('./pom.xml')!=null }}
        id: maven
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
        with:
          app-path: ""
